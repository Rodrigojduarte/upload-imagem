<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Imagens de Produtos</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: linear-gradient(to right, #f1f4f9, #dff1ff);
      color: #333;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .container {
      max-width: 720px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .toggle-group {
      display: flex;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .toggle-group button {
      flex: 1;
      padding: 0.7rem;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      background: #ddd;
      font-weight: bold;
    }

    .toggle-group button.active {
      background: #003366;
      color: white;
    }

    .drop-area {
      border: 2px dashed #2196f3;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .drop-area:hover {
      background: #f0faff;
    }

    .image-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .image-box {
      position: relative;
      width: 100px;
    }

    .image-box img {
      width: 100%;
      border-radius: 6px;
    }

    .image-box input[type="radio"] {
      position: absolute;
      top: 4px;
      left: 4px;
      transform: scale(1.2);
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .upload-btn {
      background-color: #003366;
      color: white;
      border: none;
      padding: 1rem;
      width: 100%;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .status {
      text-align: center;
      margin-top: 1rem;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }

    .links {
      margin-top: 1rem;
      padding: 1rem;
      background: #eef7ee;
      border-radius: 6px;
      word-break: break-all;
    }

    .links a {
      display: block;
      margin-bottom: 5px;
    }
  </style>

</head>

<body>

<header>
  <h1>Gestão de Imagens de Produtos</h1>
</header>

<div class="container">

<form id="form">

<label>SKU (obrigatório)</label> <input type="text" name="sku" required>

<label>Tipo de operação</label> <select name="tipo_operacao">

  <option value="nova_principal">Nova imagem principal</option>
  <option value="nova_complementar">Nova imagem complementar</option>
  <option value="substituir_principal">Substituir principal</option>
</select>

<label>Origem da imagem</label>

<div class="toggle-group">
  <button type="button" id="btnUpload" class="active">Upload</button>
  <button type="button" id="btnUrl">URL</button>
</div>

<div id="uploadArea">
  <div class="drop-area" id="dropArea">
    Clique ou arraste imagens (máx 10)
    <input type="file" id="fileInput" multiple hidden accept="image/*">
  </div>
</div>

<div id="urlArea" style="display:none;">
  <textarea id="urlInput" placeholder="Cole as URLs (uma por linha)"></textarea>
</div>

<div class="image-preview" id="preview"></div>

<button class="upload-btn">Enviar Imagens</button>

</form>

<div class="status" id="status"></div>
<div class="links" id="links"></div>

</div>

<script>

let mode = "upload";
let images = [];

const MAX_FILES = 10;
const MAX_SIZE_MB = 10;

const btnUpload = document.getElementById("btnUpload");
const btnUrl = document.getElementById("btnUrl");

btnUpload.onclick = () => switchMode("upload");
btnUrl.onclick = () => switchMode("url");

function switchMode(m) {
  mode = m;

  btnUpload.classList.toggle("active", m === "upload");
  btnUrl.classList.toggle("active", m === "url");

  document.getElementById("uploadArea").style.display = m === "upload" ? "block" : "none";
  document.getElementById("urlArea").style.display = m === "url" ? "block" : "none";
}

const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

dropArea.onclick = () => fileInput.click();

fileInput.onchange = (e) => handleFiles(e.target.files);

dropArea.ondrop = (e) => {
  e.preventDefault();
  handleFiles(e.dataTransfer.files);
};

dropArea.ondragover = (e) => e.preventDefault();

function handleFiles(files) {
  const list = [...files];

  if (images.length + list.length > MAX_FILES) {
    alert("Máximo de 10 imagens por envio.");
    return;
  }

  list.forEach(file => {

    if (!file.type.startsWith("image/")) {
      alert(`Arquivo inválido: ${file.name}`);
      return;
    }

    if (file.size > MAX_SIZE_MB * 1024 * 1024) {
      alert(`Arquivo muito grande: ${file.name}`);
      return;
    }

    const id = crypto.randomUUID();
    images.push({ id, file });

    const reader = new FileReader();
    reader.onload = () => {
      const div = document.createElement("div");
      div.className = "image-box";
      div.dataset.id = id;

      div.innerHTML = `
        <input type="radio" name="principal" value="${id}" ${images.length === 1 ? "checked" : ""}>
        <button class="remove-btn" onclick="removeImg('${id}')" type="button">×</button>
        <img src="${reader.result}">
      `;

      preview.appendChild(div);
    };

    reader.readAsDataURL(file);
  });
}

window.removeImg = (id) => {
  images = images.filter(i => i.id !== id);
  document.querySelector(`[data-id="${id}"]`)?.remove();
};

function isValidUrl(url) {
  try {
    new URL(url);
    return true;
  } catch {
    return false;
  }
}

document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();

  const status = document.getElementById("status");
  const links = document.getElementById("links");

  status.textContent = "Processando...";
  status.className = "status";
  links.innerHTML = "";

  const formData = new FormData(e.target);

  if (mode === "upload") {
    if (images.length === 0) {
      alert("Envie ao menos uma imagem.");
      return;
    }

    const principal = document.querySelector("input[name='principal']:checked")?.value;

    images.forEach((img, i) => {
      formData.append("imagens[]", img.file);
      formData.append(`principal_${i}`, img.id === principal ? "true" : "false");
    });
  }

  if (mode === "url") {
    const raw = document.getElementById("urlInput").value.trim();

    if (!raw) {
      alert("Informe ao menos uma URL.");
      return;
    }

    const urls = raw.split("\n").map(u => u.trim()).filter(u => u);

    for (let u of urls) {
      if (!isValidUrl(u)) {
        alert(`URL inválida: ${u}`);
        return;
      }
      formData.append("urls[]", u);
    }
  }

  formData.append("mode", mode);

  try {
    const res = await fetch("https://n8n.rjduarte.com.br/webhook/upload-imagem", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    if (!data.success) throw new Error(data.errors?.join(", ") || "Erro no envio");

    status.textContent = "Imagens processadas com sucesso!";
    status.className = "status success";

    data.urls.forEach(u => {
      links.innerHTML += `<a href="${u}" target="_blank">${u}</a>`;
    });

  } catch (err) {
    status.textContent = err.message;
    status.className = "status error";
  }
};

</script>

</body>
</html>
